<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos - Técnico em Informática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 shrink-0">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-2xl font-bold text-center sm:text-left">📚 Ciclo de Estudos</h1>
            <p class="text-blue-100 font-medium bg-blue-700 px-3 py-1 rounded-full text-sm">Técnico em Informática (Itanhaém)</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 sm:p-6 overflow-y-auto">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Current Subject & Form -->
            <div class="lg:col-span-1 flex flex-col gap-6">
                
                <!-- Current Subject Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 fade-in text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                    <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-2">Matéria Atual do Ciclo</h2>
                    <div id="loading-subject" class="animate-pulse flex space-x-4 justify-center">
                        <div class="h-8 bg-slate-200 rounded w-3/4"></div>
                    </div>
                    <h3 id="current-subject" class="text-xl sm:text-2xl font-bold text-blue-700 hidden">
                        <!-- Subject will be injected here -->
                    </h3>
                    <p id="cycle-progress" class="text-xs text-slate-400 mt-3 font-medium hidden">Posição de Prioridade: <span id="cycle-index">0</span>/4</p>
                </div>

                <!-- Registration Form -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 fade-in">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Registrar Sessão de Estudo</h2>
                    
                    <form id="study-form" class="space-y-4">
                        <div>
                            <label for="topic" class="block text-sm font-medium text-slate-700 mb-1">Tema da Matéria *</label>
                            <input type="text" id="topic" required placeholder="Ex: Topologias de Rede" 
                                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                        </div>
                        
                        <div>
                            <label for="summary" class="block text-sm font-medium text-slate-700 mb-1">Resumo do que estudei *</label>
                            <textarea id="summary" required rows="3" placeholder="Escreva os principais conceitos que você aprendeu nesta sessão..." 
                                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors resize-none"></textarea>
                            
                            <!-- AI Integration Button -->
                            <button type="button" id="ai-btn" class="mt-2 text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-2 px-3 rounded-lg transition-colors flex items-center gap-2 w-full justify-center">
                                <span>🤖 Analisar Resumo com IA</span>
                            </button>
                            
                            <!-- AI Result Container -->
                            <div id="ai-result" class="hidden mt-3 p-4 bg-indigo-600 text-white rounded-lg text-sm shadow-inner relative">
                                <div class="font-bold mb-1 flex items-center gap-2">
                                    <span>Tutor IA:</span>
                                </div>
                                <div id="ai-content" class="leading-relaxed opacity-90"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-2">
                            <div>
                                <label for="qtd-total" class="block text-sm font-medium text-slate-700 mb-1">Total de Questões *</label>
                                <input type="number" id="qtd-total" required min="0" placeholder="0"
                                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                            </div>
                            <div>
                                <label for="qtd-correct" class="block text-sm font-medium text-slate-700 mb-1">Acertos *</label>
                                <input type="number" id="qtd-correct" required min="0" placeholder="0"
                                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                            </div>
                        </div>

                        <!-- Custom Message Box for errors -->
                        <div id="form-message" class="hidden text-sm p-3 rounded-lg font-medium"></div>

                        <button type="submit" id="submit-btn" disabled
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 mt-4 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span>Salvar e Avançar Ciclo</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Stats & History -->
            <div class="lg:col-span-2 flex flex-col gap-6">
                
                <!-- Stats Overview -->
                <div class="grid grid-cols-3 gap-4 fade-in">
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 text-center">
                        <p class="text-sm font-medium text-slate-500 mb-1">Total de Questões</p>
                        <p id="stat-total" class="text-2xl sm:text-3xl font-bold text-slate-800">0</p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 text-center">
                        <p class="text-sm font-medium text-slate-500 mb-1">Total de Acertos</p>
                        <p id="stat-correct" class="text-2xl sm:text-3xl font-bold text-green-600">0</p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 text-center">
                        <p class="text-sm font-medium text-slate-500 mb-1">Aproveitamento</p>
                        <p id="stat-accuracy" class="text-2xl sm:text-3xl font-bold text-blue-600">0%</p>
                    </div>
                </div>

                <!-- History Table -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-grow flex flex-col fade-in">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Histórico de Estudos</h2>
                    
                    <div class="table-container overflow-x-auto overflow-y-auto max-h-[500px]">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead class="sticky top-0 bg-slate-50 shadow-sm z-10">
                                <tr>
                                    <th class="py-3 px-4 text-sm font-semibold text-slate-600 border-b whitespace-nowrap">Data/Hora</th>
                                    <th class="py-3 px-4 text-sm font-semibold text-slate-600 border-b">Matéria</th>
                                    <th class="py-3 px-4 text-sm font-semibold text-slate-600 border-b">Tema</th>
                                    <th class="py-3 px-4 text-sm font-semibold text-slate-600 border-b w-1/3">Resumo</th>
                                    <th class="py-3 px-4 text-sm font-semibold text-slate-600 border-b text-center">Score</th>
                                </tr>
                            </thead>
                            <tbody id="history-body" class="divide-y divide-slate-100">
                                <!-- Rows injected by JS -->
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400">
                                        Carregando histórico...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Firebase Scripts -->
    <script type="module">
        // 1. Sua chave do Gemini:
        const GEMINI_API_KEY = "AQ.Ab8RN6JfrGBK1RAo8h7AfDY8aCiAIYes5hY92zHrzf2aqcfM9w";

        // 2. Suas configurações do Firebase:
        const firebaseConfig = {
            apiKey: "AIzaSyActivCEd3Ai6GQmIyaFHNsTID2hA-pTjc",
            authDomain: "assist-estudos-camara-ita.firebaseapp.com",
            projectId: "assist-estudos-camara-ita",
            storageBucket: "assist-estudos-camara-ita.firebasestorage.app",
            messagingSenderId: "525061168009",
            appId: "1:525061168009:web:800b94bccb69fe1e9d1f58"
        };
        
        // ... o restante do código continua daqui para baixo ...

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ciclo-estudos-ti';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock", authDomain: "mock", projectId: "mock" 
        };
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let userId = null;

        // Core App Data - Ordered by Priority (Amount of Questions)
        const CYCLE_SUBJECTS = [
            "Informática (Conhec. Específicos)",
            "Língua Portuguesa (Conhec. Gerais)", 
            "Matemática (Conhec. Gerais)", 
            "Legislação Municipal (Conhec. Gerais)"
        ];
        
        let currentCycleIndex = 0;
        let sessionsData = [];

        // DOM Elements
        const elCurrentSubject = document.getElementById('current-subject');
        const elLoadingSubject = document.getElementById('loading-subject');
        const elCycleIndex = document.getElementById('cycle-index');
        const elCycleProgress = document.getElementById('cycle-progress');
        const elSubmitBtn = document.getElementById('submit-btn');
        const form = document.getElementById('study-form');
        const formMessage = document.getElementById('form-message');
        const elStatTotal = document.getElementById('stat-total');
        const elStatCorrect = document.getElementById('stat-correct');
        const elStatAccuracy = document.getElementById('stat-accuracy');
        const historyBody = document.getElementById('history-body');
        
        // AI DOM Elements
        const aiBtn = document.getElementById('ai-btn');
        const aiResult = document.getElementById('ai-result');
        const aiContent = document.getElementById('ai-content');

        // Initialization
        async function initApp() {
            try {
                // Rule 3: Auth Before Queries
                if (initialToken) {
                    const userCredential = await signInWithCustomToken(auth, initialToken);
                    userId = userCredential.user.uid;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    userId = userCredential.user.uid;
                }
                
                setupRealtimeListeners();
                elSubmitBtn.disabled = false;
                
            } catch (error) {
                console.error("Authentication Error:", error);
                showMessage("Erro ao conectar com o banco de dados. Tente atualizar a página.", "error");
            }
        }

        // Listeners for Firestore Data (Rule 1 & Rule 2 applied)
        function setupRealtimeListeners() {
            if (!userId) return;

            // 1. Listen to Cycle State
            const stateRef = doc(db, 'artifacts', appId, 'users', userId, 'state', 'cycle');
            onSnapshot(stateRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentCycleIndex = docSnap.data().currentIndex || 0;
                } else {
                    currentCycleIndex = 0;
                    setDoc(stateRef, { currentIndex: 0 }).catch(console.error);
                }
                updateSubjectUI();
            }, (error) => {
                console.error("Error fetching cycle state:", error);
            });

            // 2. Listen to Study History (No orderBy, fetch all and sort in JS)
            const sessionsColRef = collection(db, 'artifacts', appId, 'users', userId, 'sessions');
            onSnapshot(sessionsColRef, (snapshot) => {
                sessionsData = [];
                snapshot.forEach(doc => {
                    sessionsData.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort in memory by timestamp descending
                sessionsData.sort((a, b) => b.timestamp - a.timestamp);
                
                updateHistoryUI();
                updateStatsUI();
            }, (error) => {
                console.error("Error fetching sessions:", error);
            });
        }

        // UI Updates
        function updateSubjectUI() {
            elLoadingSubject.classList.add('hidden');
            elCurrentSubject.classList.remove('hidden');
            elCycleProgress.classList.remove('hidden');
            
            elCurrentSubject.textContent = CYCLE_SUBJECTS[currentCycleIndex];
            elCycleIndex.textContent = currentCycleIndex + 1;
        }

        function updateStatsUI() {
            let totalQ = 0;
            let totalC = 0;

            sessionsData.forEach(s => {
                totalQ += (s.questionsTotal || 0);
                totalC += (s.questionsCorrect || 0);
            });

            elStatTotal.textContent = totalQ;
            elStatCorrect.textContent = totalC;
            
            const accuracy = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;
            elStatAccuracy.textContent = accuracy + "%";
            
            if (accuracy >= 80) elStatAccuracy.className = "text-2xl sm:text-3xl font-bold text-green-600";
            else if (accuracy >= 60) elStatAccuracy.className = "text-2xl sm:text-3xl font-bold text-yellow-500";
            else elStatAccuracy.className = "text-2xl sm:text-3xl font-bold text-red-500";
        }

        function updateHistoryUI() {
            historyBody.innerHTML = '';
            
            if (sessionsData.length === 0) {
                historyBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-500 italic">
                            Nenhuma sessão registrada ainda. Comece a estudar!
                        </td>
                    </tr>`;
                return;
            }

            sessionsData.forEach(session => {
                // Formatting Date and Exact Time
                const dateObj = new Date(session.timestamp);
                const dateStr = dateObj.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                
                const accuracy = session.questionsTotal > 0 
                    ? Math.round((session.questionsCorrect / session.questionsTotal) * 100) 
                    : 0;
                
                let accColor = "text-red-600";
                if(accuracy >= 80) accColor = "text-green-600";
                else if (accuracy >= 60) accColor = "text-yellow-600";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-sm text-slate-600 whitespace-nowrap">
                        <div class="font-medium">${dateStr}</div>
                        <div class="text-xs text-slate-400">${timeStr}</div>
                    </td>
                    <td class="py-3 px-4 text-sm font-medium text-slate-800 whitespace-nowrap">${session.subject}</td>
                    <td class="py-3 px-4 text-sm text-slate-700">${session.topic}</td>
                    <td class="py-3 px-4 text-sm text-slate-500 max-w-xs truncate" title="${session.summary || ''}">
                        ${session.summary || '-'}
                    </td>
                    <td class="py-3 px-4 text-sm font-bold ${accColor} text-center whitespace-nowrap">
                        ${session.questionsCorrect}/${session.questionsTotal} <br><span class="text-xs opacity-75">(${accuracy}%)</span>
                    </td>
                `;
                historyBody.appendChild(tr);
            });
        }

        function showMessage(msg, type) {
            formMessage.textContent = msg;
            formMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (type === 'error') {
                formMessage.classList.add('bg-red-100', 'text-red-700');
            } else {
                formMessage.classList.add('bg-green-100', 'text-green-700');
            }
            
            setTimeout(() => {
                formMessage.classList.add('hidden');
            }, 4000);
        }

        // Gemini AI Integration
        aiBtn.addEventListener('click', async () => {
            const topic = document.getElementById('topic').value.trim();
            const summary = document.getElementById('summary').value.trim();
            
            if (!topic || !summary) {
                showMessage("Preencha o 'Tema da Matéria' e o 'Resumo' primeiro para a IA poder analisar.", "error");
                return;
            }

            aiBtn.disabled = true;
            aiBtn.innerHTML = `<span><svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-indigo-700 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Analisando...</span>`;
            aiResult.classList.remove('hidden');
            aiContent.innerHTML = `<span class="animate-pulse">O tutor IA está lendo seu resumo e preparando um feedback...</span>`;

            try {
                const prompt = `Atue como um professor tutor especialista em concursos públicos (foco no cargo de Técnico de Informática). 
O aluno estudou o tema "${topic}" e escreveu o seguinte resumo:
"${summary}"

Forneça um feedback curto, direto e construtivo (máximo 1 parágrafo). Corrija possíveis erros conceituais se houver, elogie o que estiver correto e dê uma dica rápida de estudo ou mnemônico. Aja de forma encorajadora.`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                const apiKey = ""; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];
                
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    let text = candidate.content.parts[0].text;
                    // Format basic markdown bold to HTML
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    aiContent.innerHTML = text;
                } else {
                    aiContent.innerHTML = `<span class="text-red-200">Não foi possível gerar a análise. Verifique sua conexão.</span>`;
                }
            } catch (error) {
                console.error("AI Error:", error);
                aiContent.innerHTML = `<span class="text-red-200">Erro ao contatar o tutor IA. Tente novamente mais tarde.</span>`;
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerHTML = `<span>🤖 Analisar Resumo com IA</span>`;
            }
        });

        // Form Handling
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!userId) return;

            const topic = document.getElementById('topic').value.trim();
            const summary = document.getElementById('summary').value.trim();
            const qTotal = parseInt(document.getElementById('qtd-total').value, 10);
            const qCorrect = parseInt(document.getElementById('qtd-correct').value, 10);

            if (qCorrect > qTotal) {
                showMessage("Os acertos não podem ser maiores que o total de questões.", "error");
                return;
            }

            elSubmitBtn.disabled = true;
            elSubmitBtn.innerHTML = `<span>Salvando...</span>`;

            try {
                // Save session
                const sessionsColRef = collection(db, 'artifacts', appId, 'users', userId, 'sessions');
                await addDoc(sessionsColRef, {
                    timestamp: Date.now(),
                    subject: CYCLE_SUBJECTS[currentCycleIndex],
                    topic: topic,
                    summary: summary,
                    questionsTotal: qTotal,
                    questionsCorrect: qCorrect
                });

                // Advance cycle
                const nextIndex = (currentCycleIndex + 1) % CYCLE_SUBJECTS.length;
                const stateRef = doc(db, 'artifacts', appId, 'users', userId, 'state', 'cycle');
                await setDoc(stateRef, { currentIndex: nextIndex });

                // Reset form and UI
                form.reset();
                aiResult.classList.add('hidden');
                aiContent.innerHTML = '';
                
                showMessage("Sessão registrada com sucesso! Avançando ciclo...", "success");

            } catch (error) {
                console.error("Error saving session:", error);
                showMessage("Erro ao salvar. Tente novamente.", "error");
            } finally {
                elSubmitBtn.disabled = false;
                elSubmitBtn.innerHTML = `
                    <span>Salvar e Avançar Ciclo</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>`;
            }
        });

        // Start App
        initApp();
  </script>
</body>
</html>
