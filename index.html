<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos - Técnico em Informática</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 font-sans text-gray-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-800">📚 Ciclo de Estudos (Itanhaém)</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Esquerda: Ciclo e Formulário -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Matéria Atual do Ciclo</h2>
                    <div id="materia-atual" class="text-xl font-bold text-blue-700 bg-blue-100 p-3 rounded-lg text-center">
                        Carregando...
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Registrar Sessão de Estudo</h2>
                    <form id="form-estudo" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tema da Matéria *</label>
                            <input type="text" id="tema" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Resumo do que estudei *</label>
                            <textarea id="resumo" required rows="3" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <button type="button" id="btn-ia" class="w-full bg-purple-100 text-purple-700 hover:bg-purple-200 font-semibold py-2 px-4 rounded-md text-sm flex items-center justify-center transition">
                            🤖 Analisar Resumo com IA
                        </button>
                        <div id="feedback-ia" class="hidden mt-2 p-3 bg-purple-50 border border-purple-200 text-sm text-purple-800 rounded-md max-h-48 overflow-y-auto"></div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Total de Questões *</label>
                                <input type="number" id="questoes" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Acertos *</label>
                                <input type="number" id="acertos" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-salvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition mt-4">
                            Salvar e Avançar Ciclo ➔
                        </button>
                    </form>
                </div>
            </div>

            <!-- Direita: Histórico -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Histórico de Estudos</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="p-3">Data/Hora</th>
                                    <th class="p-3">Matéria</th>
                                    <th class="p-3">Tema</th>
                                    <th class="p-3">Score</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-historico" class="text-sm divide-y divide-gray-100">
                                <tr><td colspan="4" class="p-4 text-center text-gray-500">Carregando histórico...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // Firebase AI Logic: não armazene chaves privadas do Gemini neste arquivo.
        import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-ai.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app-check.js";

        // Chave PÚBLICA de SITE do reCAPTCHA Enterprise (não é a chave da API Gemini).
        // Configure o domínio do GitHub Pages no reCAPTCHA Enterprise e o App Check no Firebase.
        const RECAPTCHA_SITE_KEY = "6LfuLQIuAAAAABxtdl0d1FjNxauQCdIjNunfINjd";
        
        // Configurações do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyActivCEd3Ai6GQmIyaFHNsTID2hA-pTjc",
            authDomain: "assist-estudos-camara-ita.firebaseapp.com",
            projectId: "assist-estudos-camara-ita",
            storageBucket: "assist-estudos-camara-ita.firebasestorage.app",
            messagingSenderId: "525061168009",
            appId: "1:525061168009:web:800b94bccb69fe1e9d1f58"
        };

        const app = initializeApp(firebaseConfig);

        // O Firebase AI Logic usa o Firebase e seu proxy de autenticação,
        // sem expor um segredo Gemini aos visitantes do site.
        let modeloIA = null;
        if (RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith("COLE_AQUI")) {
            initializeAppCheck(app, {
                provider: new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),
                isTokenAutoRefreshEnabled: true
            });
            const ai = getAI(app, { backend: new GoogleAIBackend() });
            modeloIA = getGenerativeModel(ai, { model: "gemini-3.5-flash-lite" });
        } else {
            console.warn("Configure RECAPTCHA_SITE_KEY e habilite Firebase AI Logic + App Check.");
        }

        // App Check já foi inicializado; agora podemos acessar o Firestore.
        const db = getFirestore(app);

        // Ciclo Ponderado de matérias (Informática com maior peso)
        const materias = [
            "Informática", "Português", "Informática", "Matemática", 
            "Informática", "Legislação", "Informática", "Português", 
            "Informática", "Matemática"
        ];

        let indexAtual = parseInt(localStorage.getItem('indexCiclo')) || 0;
        const elMateriaAtual = document.getElementById('materia-atual');
        const elTabela = document.getElementById('tabela-historico');
        const form = document.getElementById('form-estudo');
        
        function atualizarCiclo() {
            elMateriaAtual.innerText = materias[indexAtual];
            localStorage.setItem('indexCiclo', indexAtual);
        }

        async function carregarHistorico() {
            try {
                const q = query(collection(db, "estudos"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                elTabela.innerHTML = '';
                
                if(querySnapshot.empty) {
                    elTabela.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum estudo registrado ainda.</td></tr>';
                    return;
                }
                
                // Preencha as células com textContent para não interpretar HTML salvo no banco.
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const dataFormatada = data.timestamp ? new Date(data.timestamp).toLocaleString('pt-BR') : '-';
                    const taxa = data.questoes > 0 ? Math.round((data.acertos / data.questoes) * 100) : 0;
                    const cor = taxa >= 70 ? 'text-green-600' : (taxa >= 50 ? 'text-yellow-600' : 'text-red-600');

                    const linha = document.createElement('tr');
                    linha.className = 'hover:bg-gray-50 transition';
                    const dataCel = document.createElement('td');
                    dataCel.className = 'p-3 whitespace-nowrap text-xs text-gray-500';
                    dataCel.textContent = dataFormatada;
                    const materiaCel = document.createElement('td');
                    materiaCel.className = 'p-3 font-medium text-gray-800';
                    materiaCel.textContent = data.materia || '-';
                    const temaCel = document.createElement('td');
                    temaCel.className = 'p-3 text-gray-600 truncate max-w-xs';
                    temaCel.textContent = data.tema || '-';
                    temaCel.title = data.resumo || '';
                    const scoreCel = document.createElement('td');
                    scoreCel.className = `p-3 font-bold ${cor}`;
                    scoreCel.textContent = `${data.acertos}/${data.questoes} (${taxa}%)`;
                    linha.append(dataCel, materiaCel, temaCel, scoreCel);
                    elTabela.appendChild(linha);
                });
            } catch (error) {
                console.error("Erro ao carregar:", error);
                elTabela.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Erro ao conectar ao banco de dados.</td></tr>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.disabled = true;
            btn.innerText = "Salvando...";

            const tema = document.getElementById('tema').value;
            const resumo = document.getElementById('resumo').value;
            const questoes = parseInt(document.getElementById('questoes').value);
            const acertos = parseInt(document.getElementById('acertos').value);

            if(acertos > questoes) {
                alert("Os acertos não podem ser superiores ao total de questões!");
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
                return;
            }

            try {
                await addDoc(collection(db, "estudos"), {
                    materia: materias[indexAtual],
                    tema: tema,
                    resumo: resumo,
                    questoes: questoes,
                    acertos: acertos,
                    timestamp: Date.now()
                });
                
                form.reset();
                document.getElementById('feedback-ia').classList.add('hidden');
                indexAtual = (indexAtual + 1) % materias.length;
                atualizarCiclo();
                await carregarHistorico();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Ocorreu um erro ao salvar o estudo na nuvem.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
            }
        });

        // Análise didática do resumo com Firebase AI Logic.
        document.getElementById('btn-ia').addEventListener('click', async () => {
            const resumo = document.getElementById('resumo').value.trim();
            const tema = document.getElementById('tema').value.trim();
            const materia = materias[indexAtual];
            const btn = document.getElementById('btn-ia');
            const feedback = document.getElementById('feedback-ia');

            if (!resumo || !tema) {
                alert("Preencha o tema e o resumo antes de pedir ajuda à IA!");
                return;
            }

            feedback.classList.remove('hidden');
            feedback.style.whiteSpace = 'pre-wrap';
            if (!modeloIA) {
                feedback.textContent = "Antes de usar a IA, habilite Firebase AI Logic e App Check no Console Firebase e substitua RECAPTCHA_SITE_KEY pela chave pública do site.";
                return;
            }

            btn.textContent = "Analisando...";
            btn.disabled = true;
            feedback.textContent = "A IA está analisando o seu resumo...";

            try {
                const prompt = `Você é um professor de concursos públicos, especializado em provas de Técnico de Informática da banca VUNESP.
Disciplina: ${materia}.
Tema informado: ${tema}.
O aluno escreveu: ${resumo}

Em português do Brasil, dê no máximo 3 frases objetivas: (1) o que está correto, (2) correção dos erros conceituais, se houver, e (3) uma dica de memorização ou prova. Se o tema não corresponder ao resumo, avise. Não invente informações.`;
                const resultado = await modeloIA.generateContent(prompt);
                const texto = resultado.response.text();
                feedback.textContent = "Feedback do Professor IA:\n\n" + (texto || "A IA não retornou conteúdo. Tente novamente.");
            } catch (error) {
                console.error("Falha no Firebase AI Logic:", error);
                feedback.textContent = "Falha ao analisar o resumo: " + (error.message || "erro desconhecido") + "\nVerifique a configuração do AI Logic, o App Check e as permissões do projeto.";
            } finally {
                btn.textContent = "🤖 Analisar Resumo com IA";
                btn.disabled = false;
            }
        });

        atualizarCiclo();
        carregarHistorico();
    </script>
</body>
</html>
