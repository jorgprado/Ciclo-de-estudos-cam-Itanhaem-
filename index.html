<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos - Técnico em Informática</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 font-sans text-gray-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-800">📚 Ciclo de Estudos (Itanhaém)</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Esquerda: Ciclo e Formulário -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Matéria Atual do Ciclo</h2>
                    <div id="materia-atual" class="text-xl font-bold text-blue-700 bg-blue-100 p-3 rounded-lg text-center">
                        A carregar...
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Registar Sessão de Estudo</h2>
                    <form id="form-estudo" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tema da Matéria *</label>
                            <input type="text" id="tema" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Resumo do que estudei *</label>
                            <textarea id="resumo" required rows="3" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <button type="button" id="btn-ia" class="w-full bg-purple-100 text-purple-700 hover:bg-purple-200 font-semibold py-2 px-4 rounded-md text-sm flex items-center justify-center transition">
                            🤖 Analisar Resumo com IA
                        </button>
                        <div id="feedback-ia" class="hidden mt-2 p-3 bg-purple-50 border border-purple-200 text-sm text-purple-800 rounded-md max-h-48 overflow-y-auto"></div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Total de Questões *</label>
                                <input type="number" id="questoes" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Acertos *</label>
                                <input type="number" id="acertos" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-salvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition mt-4">
                            Salvar e Avançar Ciclo ➔
                        </button>
                    </form>
                </div>
            </div>

            <!-- Direita: Histórico -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Histórico de Estudos</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="p-3">Data/Hora</th>
                                    <th class="p-3">Matéria</th>
                                    <th class="p-3">Tema</th>
                                    <th class="p-3">Score</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-historico" class="text-sm divide-y divide-gray-100">
                                <tr><td colspan="4" class="p-4 text-center text-gray-500">A carregar histórico...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // As suas Chaves de API
        const GEMINI_API_KEY = "AQ.Ab8RN6JfrGBK1RAo8h7AfDY8aCiAIYes5hY92zHrzf2aqcfM9w";
        const firebaseConfig = {
            apiKey: "AIzaSyActivCEd3Ai6GQmIyaFHNsTID2hA-pTjc",
            authDomain: "assist-estudos-camara-ita.firebaseapp.com",
            projectId: "assist-estudos-camara-ita",
            storageBucket: "assist-estudos-camara-ita.firebasestorage.app",
            messagingSenderId: "525061168009",
            appId: "1:525061168009:web:800b94bccb69fe1e9d1f58"
        };

        // Iniciar Firebase e Banco de Dados
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ciclo Ponderado: Informática repete muito mais devido ao peso no edital (24 questões)
        const materias = [
            "Informática",
            "Português",
            "Informática",
            "Matemática",
            "Informática",
            "Legislação",
            "Informática",
            "Português",
            "Informática",
            "Matemática"
        ];

        let indexAtual = parseInt(localStorage.getItem('indexCiclo')) || 0;
        const elMateriaAtual = document.getElementById('materia-atual');
        const elTabela = document.getElementById('tabela-historico');
        const form = document.getElementById('form-estudo');
        
        function atualizarCiclo() {
            elMateriaAtual.innerText = materias[indexAtual];
            localStorage.setItem('indexCiclo', indexAtual);
        }

        async function carregarHistorico() {
            try {
                const q = query(collection(db, "estudos"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                elTabela.innerHTML = '';
                
                if(querySnapshot.empty) {
                    elTabela.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum estudo registado ainda.</td></tr>';
                    return;
                }
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const dataFormatada = data.timestamp ? new Date(data.timestamp).toLocaleString('pt-BR') : '-';
                    const taxa = data.questoes > 0 ? Math.round((data.acertos / data.questoes) * 100) : 0;
                    const cor = taxa >= 70 ? 'text-green-600' : (taxa >= 50 ? 'text-yellow-600' : 'text-red-600');
                    
                    elTabela.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-3 whitespace-nowrap text-xs text-gray-500">${dataFormatada}</td>
                            <td class="p-3 font-medium text-gray-800">${data.materia}</td>
                            <td class="p-3 text-gray-600 truncate max-w-xs" title="${data.resumo}">${data.tema}</td>
                            <td class="p-3 font-bold ${cor}">${data.acertos}/${data.questoes} (${taxa}%)</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao carregar:", error);
                elTabela.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-500">Erro ao ligar à base de dados.</td></tr>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.disabled = true;
            btn.innerText = "A guardar...";

            const tema = document.getElementById('tema').value;
            const resumo = document.getElementById('resumo').value;
            const questoes = parseInt(document.getElementById('questoes').value);
            const acertos = parseInt(document.getElementById('acertos').value);

            if(acertos > questoes) {
                alert("Os acertos não podem ser superiores ao total de questões!");
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
                return;
            }

            try {
                // Guarda no Firebase com data e hora exatas
                await addDoc(collection(db, "estudos"), {
                    materia: materias[indexAtual],
                    tema: tema,
                    resumo: resumo,
                    questoes: questoes,
                    acertos: acertos,
                    timestamp: Date.now()
                });
                
                form.reset();
                document.getElementById('feedback-ia').classList.add('hidden');
                
                // Roda o ciclo
                indexAtual = (indexAtual + 1) % materias.length;
                atualizarCiclo();
                await carregarHistorico();
            } catch (error) {
                console.error("Erro ao guardar:", error);
                alert("Ocorreu um erro ao guardar o estudo na nuvem.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
            }
        });

        // Integração com a IA do Gemini
        document.getElementById('btn-ia').addEventListener('click', async () => {
            const resumo = document.getElementById('resumo').value;
            const tema = document.getElementById('tema').value;
            const materia = materias[indexAtual];
            
            if(!resumo || !tema) {
                alert("Preencha o tema e o resumo antes de pedir ajuda à IA!");
                return;
            }

            const btn = document.getElementById('btn-ia');
            const feedback = document.getElementById('feedback-ia');
            btn.innerText = "A analisar...";
            btn.disabled = true;
            feedback.classList.remove('hidden');
            feedback.innerHTML = "A IA está a rever o seu resumo...";

            try {
                // Método mais seguro para navegadores: Chave diretamente na URL e modelo atualizado
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Atue como um professor especialista em concursos de TI. Avalie este resumo do aluno sobre o tema "${tema}" da disciplina "${materia}". Dê um feedback curto (máximo 3 frases), corrija algum erro concetual se houver, e dê uma dica rápida para a prova. Resumo do aluno: "${resumo}"` }] }]
                    })
                });
                
                if (!response.ok) {
                    if(response.status === 401) throw new Error("Chave Inválida");
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                feedback.innerHTML = `<strong>Feedback do Professor IA:</strong><br>` + data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error("Erro detalhado:", error);
                if(error.message === "Chave Inválida") {
                    feedback.innerHTML = `<span class="text-red-600 font-bold">Erro 401: A chave da API inserida não é válida. Por favor, gere uma chave nova que comece com "AIzaSy" no Google AI Studio.</span>`;
                } else {
                    feedback.innerText = "Erro ao contactar a IA. Tente novamente.";
                }
            } finally {
                btn.innerText = "🤖 Analisar Resumo com IA";
                btn.disabled = false;
            }
        });

        // Arranque da aplicação
        atualizarCiclo();
        carregarHistorico();
    </script>
</body>
</html>
