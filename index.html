<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo de Estudos - Técnico em Informática</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 font-sans text-gray-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-blue-800">📚 Ciclo de Estudos (Itanhaém)</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Esquerda: Ciclo e Formulário -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Matéria Atual do Ciclo</h2>
                    <div id="materia-atual" class="text-xl font-bold text-blue-700 bg-blue-100 p-3 rounded-lg text-center">
                        Carregando...
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Registrar Sessão de Estudo</h2>
                    <form id="form-estudo" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tema da Matéria *</label>
                            <input type="text" id="tema" required class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Resumo do que estudei *</label>
                            <textarea id="resumo" required rows="3" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <button type="button" id="btn-ia" class="w-full bg-purple-100 text-purple-700 hover:bg-purple-200 font-semibold py-2 px-4 rounded-md text-sm flex items-center justify-center transition">
                            🤖 Analisar Resumo com IA
                        </button>
                        <div id="feedback-ia" class="hidden mt-2 p-3 bg-purple-50 border border-purple-200 text-sm text-purple-800 rounded-md max-h-48 overflow-y-auto"></div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Total de Questões *</label>
                                <input type="number" id="questoes" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Acertos *</label>
                                <input type="number" id="acertos" required min="0" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <button type="submit" id="btn-salvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition mt-4">
                            Salvar e Avançar Ciclo ➔
                        </button>
                    </form>
                </div>
            </div>

            <!-- Direita: Histórico clicável -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h2 class="text-lg font-bold text-gray-800 mb-1">Histórico de Estudos</h2>
                    <p class="text-xs text-gray-500 mb-4">Clique em uma sessão para ver seu resumo e a análise da IA.</p>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="p-3">Data/Hora</th>
                                    <th class="p-3">Matéria</th>
                                    <th class="p-3">Tema</th>
                                    <th class="p-3">Score</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-historico" class="text-sm divide-y divide-gray-100">
                                <tr><td colspan="4" class="p-4 text-center text-gray-500">Carregando histórico...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // Firebase AI Logic: não armazene chaves privadas do Gemini neste arquivo.
        import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-ai.js";
        import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app-check.js";

        // Chave PÚBLICA de SITE do reCAPTCHA Enterprise (não é a chave da API Gemini).
        // Configure o domínio do GitHub Pages no reCAPTCHA Enterprise e o App Check no Firebase.
        const RECAPTCHA_SITE_KEY = "6LfuLQIuAAAAABxtdlOd1FjNxauQCdIjNunfINjd";
        
        // Configurações do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyActivCEd3Ai6GQmIyaFHNsTID2hA-pTjc",
            authDomain: "assist-estudos-camara-ita.firebaseapp.com",
            projectId: "assist-estudos-camara-ita",
            storageBucket: "assist-estudos-camara-ita.firebasestorage.app",
            messagingSenderId: "525061168009",
            appId: "1:525061168009:web:800b94bccb69fe1e9d1f58"
        };

        const app = initializeApp(firebaseConfig);

        // O Firebase AI Logic usa o Firebase e seu proxy de autenticação,
        // sem expor um segredo Gemini aos visitantes do site.
        let modeloIA = null;
        if (RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith("COLE_AQUI")) {
            initializeAppCheck(app, {
                provider: new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),
                isTokenAutoRefreshEnabled: true
            });
            const ai = getAI(app, { backend: new GoogleAIBackend() });
            modeloIA = getGenerativeModel(ai, { model: "gemini-3.5-flash-lite" });
        } else {
            console.warn("Configure RECAPTCHA_SITE_KEY e habilite Firebase AI Logic + App Check.");
        }

        // App Check já foi inicializado; agora podemos acessar o Firestore.
        const db = getFirestore(app);

        // Ciclo Ponderado de matérias (Informática com maior peso)
        const materias = [
            "Informática", "Português", "Informática", "Matemática", 
            "Informática", "Legislação", "Informática", "Português", 
            "Informática", "Matemática"
        ];

        let indexAtual = parseInt(localStorage.getItem('indexCiclo')) || 0;
        const elMateriaAtual = document.getElementById('materia-atual');
        const elTabela = document.getElementById('tabela-historico');
        const form = document.getElementById('form-estudo');
        const elTema = document.getElementById('tema');
        const elResumo = document.getElementById('resumo');
        const elFeedback = document.getElementById('feedback-ia');

        // Só guardamos o feedback se for referente exatamente ao texto salvo.
        let ultimaAnaliseIA = null;
        [elTema, elResumo].forEach(campo => {
            campo.addEventListener('input', () => {
                ultimaAnaliseIA = null;
                elFeedback.classList.add('hidden');
                elFeedback.textContent = '';
            });
        });
        
        function atualizarCiclo() {
            elMateriaAtual.innerText = materias[indexAtual];
            localStorage.setItem('indexCiclo', indexAtual);
        }

        // Monta a seção de detalhes usando textContent para não executar HTML vindo do banco.
        function blocoDetalhe(titulo, conteudo, classes) {
            const bloco = document.createElement('div');
            bloco.className = classes;
            const cabecalho = document.createElement('h3');
            cabecalho.className = 'font-semibold text-sm mb-2';
            cabecalho.textContent = titulo;
            const texto = document.createElement('p');
            texto.className = 'text-sm whitespace-pre-wrap break-words leading-relaxed';
            texto.textContent = conteudo;
            bloco.append(cabecalho, texto);
            return bloco;
        }

        async function carregarHistorico() {
            try {
                const q = query(collection(db, 'estudos'), orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);
                elTabela.replaceChildren();

                if (querySnapshot.empty) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 4;
                    td.className = 'p-4 text-center text-gray-500';
                    td.textContent = 'Nenhum estudo registrado ainda.';
                    tr.appendChild(td);
                    elTabela.appendChild(tr);
                    return;
                }

                querySnapshot.forEach(registro => {
                    const data = registro.data();
                    const dataFormatada = data.timestamp
                        ? new Date(data.timestamp).toLocaleString('pt-BR') : '-';
                    const total = Number(data.questoes) || 0;
                    const acertos = Number(data.acertos) || 0;
                    const taxa = total > 0 ? Math.round((acertos / total) * 100) : 0;
                    const cor = taxa >= 70 ? 'text-green-600'
                        : (taxa >= 50 ? 'text-yellow-600' : 'text-red-600');

                    const linha = document.createElement('tr');
                    linha.className = 'cursor-pointer hover:bg-blue-50 transition';
                    linha.title = 'Clique para expandir os detalhes desta sessão';

                    const celula = (classe, valor) => {
                        const td = document.createElement('td');
                        td.className = classe;
                        td.textContent = valor;
                        return td;
                    };
                    const dataCel = celula('p-3 whitespace-nowrap text-xs text-gray-500', dataFormatada);
                    const materiaCel = celula('p-3 font-medium text-gray-800', data.materia || '-');
                    const temaCel = document.createElement('td');
                    temaCel.className = 'p-3 text-gray-700';
                    const botao = document.createElement('button');
                    botao.type = 'button';
                    botao.className = 'w-full text-left font-medium text-blue-700 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600 rounded';
                    botao.textContent = (data.tema || 'Sem tema') + '  ▾';
                    botao.setAttribute('aria-expanded', 'false');
                    const idDetalhe = 'detalhe-' + registro.id;
                    botao.setAttribute('aria-controls', idDetalhe);
                    botao.setAttribute('aria-label', 'Mostrar detalhes de ' + (data.tema || 'sessão'));
                    temaCel.appendChild(botao);
                    const scoreCel = celula(`p-3 font-bold whitespace-nowrap ${cor}`, `${acertos}/${total} (${taxa}%)`);
                    linha.append(dataCel, materiaCel, temaCel, scoreCel);

                    const detalheLinha = document.createElement('tr');
                    detalheLinha.id = idDetalhe;
                    detalheLinha.className = 'hidden';
                    const detalheCel = document.createElement('td');
                    detalheCel.colSpan = 4;
                    detalheCel.className = 'p-3 md:p-5 bg-blue-50 border-b border-blue-100';
                    const cards = document.createElement('div');
                    cards.className = 'grid grid-cols-1 gap-3';
                    cards.appendChild(blocoDetalhe(
                        '📘 Resumo do que estudei',
                        data.resumo || 'Nenhum resumo foi registrado nesta sessão.',
                        'bg-white rounded-lg p-4 border border-blue-100 text-gray-800'
                    ));
                    cards.appendChild(blocoDetalhe(
                        '🤖 Comentário do professor IA',
                        data.comentarioIA || 'Nenhum comentário da IA foi salvo nesta sessão. Registros anteriores à atualização não possuem esse campo.',
                        'bg-purple-50 rounded-lg p-4 border border-purple-200 text-purple-900'
                    ));
                    detalheCel.appendChild(cards);
                    detalheLinha.appendChild(detalheCel);

                    const alternar = () => {
                        const aberto = detalheLinha.classList.toggle('hidden') === false;
                        botao.setAttribute('aria-expanded', String(aberto));
                        botao.textContent = (data.tema || 'Sem tema') + (aberto ? '  ▴' : '  ▾');
                    };
                    linha.addEventListener('click', alternar);
                    elTabela.append(linha, detalheLinha);
                });
            } catch (error) {
                console.error('Erro ao carregar:', error);
                const linha = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 4;
                td.className = 'p-4 text-center text-red-500';
                td.textContent = 'Erro ao conectar ao banco de dados.';
                linha.appendChild(td);
                elTabela.replaceChildren(linha);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            btn.disabled = true;
            btn.innerText = "Salvando...";

            const tema = elTema.value.trim();
            const resumo = elResumo.value.trim();
            const questoes = parseInt(document.getElementById('questoes').value);
            const acertos = parseInt(document.getElementById('acertos').value);

            if(acertos > questoes) {
                alert("Os acertos não podem ser superiores ao total de questões!");
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
                return;
            }

            try {
                await addDoc(collection(db, "estudos"), {
                    materia: materias[indexAtual],
                    tema: tema,
                    resumo: resumo,
                    // A análise é opcional. O texto só é salvo se corresponder ao resumo atual.
                    comentarioIA: (ultimaAnaliseIA &&
                        ultimaAnaliseIA.tema === tema &&
                        ultimaAnaliseIA.resumo === resumo &&
                        ultimaAnaliseIA.materia === materias[indexAtual])
                        ? ultimaAnaliseIA.comentario : null,
                    questoes: questoes,
                    acertos: acertos,
                    timestamp: Date.now()
                });
                
                form.reset();
                ultimaAnaliseIA = null;
                elFeedback.textContent = '';
                elFeedback.classList.add('hidden');
                indexAtual = (indexAtual + 1) % materias.length;
                atualizarCiclo();
                await carregarHistorico();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Ocorreu um erro ao salvar o estudo na nuvem.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Salvar e Avançar Ciclo ➔";
            }
        });

        // Análise didática do resumo com Firebase AI Logic.
        document.getElementById('btn-ia').addEventListener('click', async () => {
            const resumo = elResumo.value.trim();
            const tema = elTema.value.trim();
            const materia = materias[indexAtual];
            const btn = document.getElementById('btn-ia');
            const feedback = elFeedback;
            ultimaAnaliseIA = null;

            if (!resumo || !tema) {
                alert("Preencha o tema e o resumo antes de pedir ajuda à IA!");
                return;
            }

            feedback.classList.remove('hidden');
            feedback.style.whiteSpace = 'pre-wrap';
            if (!modeloIA) {
                feedback.textContent = "Antes de usar a IA, habilite Firebase AI Logic e App Check no Console Firebase e substitua RECAPTCHA_SITE_KEY pela chave pública do site.";
                return;
            }

            btn.textContent = "Analisando...";
            btn.disabled = true;
            feedback.textContent = "A IA está analisando o seu resumo...";

            try {
                const prompt = `Você é um professor de concursos públicos, especializado em provas de Técnico de Informática da banca VUNESP.
Disciplina: ${materia}.
Tema informado: ${tema}.
O aluno escreveu: ${resumo}

Em português do Brasil, dê no máximo 3 frases objetivas: (1) o que está correto, (2) correção dos erros conceituais, se houver, e (3) uma dica de memorização ou prova. Se o tema não corresponder ao resumo, avise. Não invente informações.`;
                const resultado = await modeloIA.generateContent(prompt);
                const texto = (resultado.response.text() || '').trim();
                if (elTema.value.trim() !== tema || elResumo.value.trim() !== resumo || materias[indexAtual] !== materia) {
                    feedback.textContent = 'O tema ou resumo mudou durante a análise. Clique novamente em Analisar Resumo com IA para obter um feedback atualizado.';
                } else if (texto) {
                    ultimaAnaliseIA = { tema, resumo, materia, comentario: texto };
                    feedback.textContent = 'Feedback do Professor IA:\n\n' + texto;
                } else {
                    feedback.textContent = 'A IA não retornou conteúdo. Tente novamente.';
                }
            } catch (error) {
                console.error("Falha no Firebase AI Logic:", error);
                feedback.textContent = "Falha ao analisar o resumo: " + (error.message || "erro desconhecido") + "\nVerifique a configuração do AI Logic, o App Check e as permissões do projeto.";
            } finally {
                btn.textContent = "🤖 Analisar Resumo com IA";
                btn.disabled = false;
            }
        });

        atualizarCiclo();
        carregarHistorico();
    </script>
</body>
</html>
